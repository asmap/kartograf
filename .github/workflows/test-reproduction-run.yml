name: Test Reproduction Run

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-full-run:
    runs-on: ubuntu-latest

    steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v3

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download reproduction data hosted as release asset
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd

        mkdir -p tests/data
        curl -L \
          -o tests/data/1762444800-data.tar.zst \
          "https://github.com/asmap/sample-data/releases/download/1762444800/1762444800-data.tar.zst"

        zstd -d tests/data/1762444800-data.tar.zst -c | tar -xf - -C tests/data

    - name: Run with reproduction data and encode results
      shell: bash
      run: |
        set -euo pipefail

        nix develop --command ./run map -r tests/data/1762444800 -t 1762444800 --encode

    - name: Check text, filled, and unfilled result hashes
      working-directory: out/r1762444800
      shell: bash
      run: |
        sha256sum --check <<'EOF'
        bd43e98d95d5905eb16ccdcfdb35d9e19e090e7801e94829b0540988dbffc18d  final_result.txt
        8c921bcaa93d519e34c1b2a43718848713a427fc4a9a6a105cc668a87a5f1c6a  1762444800_asmap.dat
        1c805af2ad9c9585081ea68ada20c66bda9488070158f875460942d16d0d7127  1762444800_asmap_unfilled.dat
        EOF
